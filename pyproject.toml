[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-delay"
version = "1.0.0"
description = "Time-safe, reproducible Olist order delivery delay warning research package and offline scoring prototype (IS5126 Team 12)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
olist-delay = "olist_delay.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["olist_delay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "unit: fast unit tests for contract, leakage, labels, history, policy, and validation",
    "integration: CLI and end-to-end pipeline integration tests",
]

